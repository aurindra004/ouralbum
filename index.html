<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Album Kita 📖</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;600&family=Playfair+Display:ital@0;1&family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="book-container">
        <div class="book" id="book">
            <!-- Halaman akan di-generate oleh JS -->
        </div>

        <div class="book-nav">
            <button class="btn-nav" id="prevPage"><i class="fa-regular fa-arrow-left"></i> Sebelumnya</button>
            <span class="page-indicator" id="pageIndicator">Halaman 1</span>
            <button class="btn-nav" id="nextPage">Berikutnya <i class="fa-regular fa-arrow-right"></i></button>
        </div>

        <div class="actions">
            <button class="btn" id="randomAlbumBtn"><i class="fa-regular fa-star"></i> Album Acak</button>
            <button class="btn" id="showerBtn"><i class="fa-regular fa-heart"></i> Hujan Hati</button>
        </div>

        <footer class="footer">
            <p>dibuat dengan <i class="fa-regular fa-heart"></i> dan <span id="randomQuote"></span></p>
        </footer>
    </div>

    <!-- Modal Foto -->
    <div class="modal" id="albumModal">
        <div class="modal__content">
            <div class="modal__header">
                <h2 class="modal__title" id="modalAlbumTitle"></h2>
                <button class="modal__close" id="closeModalBtn">&times;</button>
            </div>
            <div class="carousel">
                <div class="carousel__main" id="carouselMain">
                    <img id="modalImage" src="" alt="" class="carousel__image">
                </div>
                <div class="carousel__dots" id="dotContainer"></div>
                <div class="carousel__caption">
                    <i class="fa-regular fa-message"></i>
                    <span id="captionText"></span>
                </div>
            </div>
            <div class="modal__nav">
                <button class="modal__nav-btn" id="prevPhotoBtn"><i class="fa-regular fa-circle-left"></i> Sebelumnya</button>
                <button class="modal__nav-btn" id="nextPhotoBtn">Berikutnya <i class="fa-regular fa-circle-right"></i></button>
            </div>
            <div class="modal__nav modal__nav--secondary">
                <button class="modal__nav-btn" id="prevAlbumBtn"><i class="fa-regular fa-arrow-left"></i> Album Sebelumnya</button>
                <button class="modal__nav-btn" id="nextAlbumBtn">Album Berikutnya <i class="fa-regular fa-arrow-right"></i></button>
            </div>
        </div>
    </div>

    <div class="bear" id="bear">🧸</div>

    <script src="script.js"></script>
</body>
</html>
